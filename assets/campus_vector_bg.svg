<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky Gradient: Turquoise & Teal Atmosphere inspired by Orély University -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#083344" stop-opacity="0.95" />
      <stop offset="12%" stop-color="#0E7490" />
      <stop offset="30%" stop-color="#0891B2" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="70%" stop-color="#22D3EE" />
      <stop offset="88%" stop-color="#A5F3FC" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Warm Sun Radiance & Golden Atmosphere -->
    <radialGradient id="sunGlow" cx="82%" cy="16%" r="35%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.85" />
      <stop offset="25%" stop-color="#FDE047" stop-opacity="0.4" />
      <stop offset="65%" stop-color="#67E8F9" stop-opacity="0" />
    </radialGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.70" />
    </linearGradient>

    <!-- Distant University Silhouette Gradient -->
    <linearGradient id="distantBldg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.15" />
    </linearGradient>

    <!-- Rolling Lawn Gradients -->
    <linearGradient id="hillFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="hillMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="hillFore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- 1. Sky Base Layer -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />

  <!-- 2. Warm Sun Glow -->
  <circle cx="1580" cy="170" r="280" fill="url(#sunGlow)" />

  <!-- 3. Soft Illustrated Clouds -->
  <g fill="url(#cloudGrad)">
    <!-- Cloud Left -->
    <path d="M100,220 Q140,160 210,180 Q270,140 350,170 Q430,150 470,200 Q520,220 510,260 Q500,300 430,300 L140,300 Q90,290 100,220 Z" opacity="0.88" />
    <!-- Cloud Center -->
    <path d="M660,150 Q700,100 770,120 Q830,80 910,110 Q970,90 1010,140 Q1050,160 1040,190 Q1020,220 960,220 L700,220 Q650,210 660,150 Z" opacity="0.75" />
    <!-- Cloud Right -->
    <path d="M1250,200 Q1290,150 1360,170 Q1420,130 1500,160 Q1560,140 1600,190 Q1640,210 1630,240 Q1610,270 1550,270 L1290,270 Q1240,260 1250,200 Z" opacity="0.82" />
  </g>

  <!-- 4. Distant Campus Architecture Skyline (Towers, Domes, Academic Halls) -->
  <g fill="url(#distantBldg)">
    <!-- Far Left Library Dome -->
    <path d="M100,680 L100,560 Q180,500 260,560 L260,680 Z" />
    <rect x="170" y="460" width="20" height="50" />
    <!-- University Clock Tower -->
    <rect x="340" y="420" width="70" height="260" rx="4" />
    <polygon points="335,420 375,340 415,420" fill="#0891B2" opacity="0.5" />
    <circle cx="375" cy="460" r="16" fill="#E0F2FE" opacity="0.8" />
    <!-- Modern Tech Complex -->
    <rect x="440" y="510" width="160" height="170" rx="6" />
    <rect x="640" y="480" width="120" height="200" rx="6" />
    <rect x="800" y="540" width="200" height="140" rx="4" />
    <!-- Center Main University Hall Columns and Pediment -->
    <rect x="1040" y="520" width="240" height="160" />
    <polygon points="1030,520 1160,440 1290,520" fill="#0891B2" opacity="0.6" />
    <rect x="1320" y="460" width="90" height="220" rx="4" />
    <polygon points="1315,460 1365,390 1415,460" fill="#0891B2" opacity="0.5" />
    <!-- East Engineering Wing -->
    <rect x="1450" y="500" width="180" height="180" rx="6" />
    <rect x="1670" y="530" width="150" height="150" rx="4" />
  </g>

  <!-- 5. Rolling Campus Garden Hills - Far Layer -->
  <path d="M0,720 Q480,620 960,680 Q1440,740 1920,640 L1920,1080 L0,1080 Z" fill="url(#hillFar)" opacity="0.9" />

  <!-- 6. Midground Modern Academic Quad Buildings (VR College Facilities) -->
  <g>
    <!-- Left: Innovation and Research Hub -->
    <rect x="120" y="590" width="230" height="160" rx="8" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="3" />
    <g fill="#38BDF8" opacity="0.7">
      <rect x="140" y="615" width="38" height="26" rx="2" />
      <rect x="190" y="615" width="38" height="26" rx="2" />
      <rect x="240" y="615" width="38" height="26" rx="2" />
      <rect x="290" y="615" width="38" height="26" rx="2" />
      <rect x="140" y="655" width="38" height="26" rx="2" />
      <rect x="190" y="655" width="38" height="26" rx="2" />
      <rect x="240" y="655" width="38" height="26" rx="2" />
      <rect x="290" y="655" width="38" height="26" rx="2" />
      <rect x="140" y="695" width="38" height="36" rx="2" />
      <rect x="190" y="695" width="38" height="36" rx="2" />
      <rect x="240" y="695" width="38" height="36" rx="2" />
      <rect x="290" y="695" width="38" height="36" rx="2" />
    </g>

    <!-- Center-Right: Iconic VR College Administrative Pavilion & Portal -->
    <rect x="1470" y="560" width="290" height="190" rx="8" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="3" />
    <!-- Clock Tower Accent -->
    <rect x="1595" y="480" width="60" height="90" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2" />
    <polygon points="1590,480 1625,430 1660,480" fill="#0284C7" />
    <circle cx="1625" cy="520" r="14" fill="#FEF08A" stroke="#0284C7" stroke-width="2" />
    <g fill="#38BDF8" opacity="0.75">
      <rect x="1500" y="590" width="42" height="32" rx="2" />
      <rect x="1555" y="590" width="42" height="32" rx="2" />
      <rect x="1665" y="590" width="42" height="32" rx="2" />
      <rect x="1720" y="590" width="42" height="32" rx="2" />
      <rect x="1500" y="640" width="42" height="32" rx="2" />
      <rect x="1555" y="640" width="42" height="32" rx="2" />
      <rect x="1665" y="640" width="42" height="32" rx="2" />
      <rect x="1720" y="640" width="42" height="32" rx="2" />
    </g>
    <!-- Entrance Archway -->
    <path d="M1600,750 L1600,685 Q1625,660 1650,685 L1650,750 Z" fill="#0369A1" />
  </g>

  <!-- 7. Rolling Campus Green Lawns - Mid Layer -->
  <path d="M0,780 Q540,700 1080,760 Q1620,820 1920,730 L1920,1080 L0,1080 Z" fill="url(#hillMid)" opacity="0.95" />

  <!-- 8. Lush Campus Trees & Canopy (Orély Atmosphere) -->
  <g>
    <!-- Tree Cluster 1 Left -->
    <path d="M80,730 Q95,640 140,650 Q180,620 210,660 Q240,670 230,740 Z" fill="#047857" />
    <path d="M95,730 Q110,660 145,670 Q180,640 205,675 Q230,685 220,740 Z" fill="#10B981" />
    <rect x="150" y="730" width="12" height="45" fill="#78350F" rx="2" />

    <!-- Tree Cluster 2 Center -->
    <path d="M740,770 Q770,670 830,690 Q880,650 920,700 Q960,720 950,790 Z" fill="#059669" />
    <path d="M760,770 Q785,690 835,705 Q875,675 910,715 Q940,730 930,790 Z" fill="#34D399" />
    <rect x="840" y="770" width="14" height="40" fill="#78350F" rx="2" />

    <!-- Tree Cluster 3 Right -->
    <path d="M1390,750 Q1420,660 1470,680 Q1520,640 1560,690 Q1590,710 1580,770 Z" fill="#047857" />
    <path d="M1410,750 Q1435,675 1475,695 Q1515,665 1545,705 Q1570,720 1560,770 Z" fill="#10B981" />
    <rect x="1480" y="750" width="12" height="40" fill="#78350F" rx="2" />

    <!-- Campus Cypress / Pine Accent Trees -->
    <polygon points="410,760 425,660 440,760" fill="#065F46" />
    <polygon points="412,730 425,630 438,730" fill="#047857" />
    <polygon points="1260,780 1275,680 1290,780" fill="#065F46" />
    <polygon points="1262,750 1275,650 1288,750" fill="#047857" />
  </g>

  <!-- 9. Foreground Lawn Hill with Campus Walkway -->
  <path d="M0,880 Q420,800 960,850 Q1500,900 1920,820 L1920,1080 L0,1080 Z" fill="url(#hillFore)" />

  <!-- S-Curve Campus Pathway (Light Cream Stone) -->
  <path d="M400,1080 Q620,940 820,900 Q1050,850 1150,760 L1190,760 Q1080,860 850,915 Q640,960 430,1080 Z" fill="#FEF3C7" opacity="0.9" />

  <!-- Decorative Campus Flowerbed Accents -->
  <g fill="#F59E0B" opacity="0.95">
    <circle cx="350" cy="950" r="6" />
    <circle cx="370" cy="940" r="5" />
    <circle cx="390" cy="955" r="6" />
    <circle cx="880" cy="920" r="5" />
    <circle cx="905" cy="910" r="6" />
    <circle cx="930" cy="925" r="5" />
    <circle cx="1440" cy="870" r="6" />
    <circle cx="1465" cy="860" r="5" />
    <circle cx="1490" cy="875" r="6" />
  </g>
</svg>